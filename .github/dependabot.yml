# .github/dependabot.yml
# FIX #13: Tự động scan và tạo PR khi có bản cập nhật dependency có lỗ hổng bảo mật
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # ── pnpm monorepo root ──────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      # Nhóm các patch/minor updates lại thành 1 PR để đỡ spam
      patch-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Không auto-update major versions — cần review thủ công
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ──────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
