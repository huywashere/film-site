name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: zricethezav/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: services/media-gateway/go.sum

      - name: Test Gin media gateway
        working-directory: services/media-gateway
        run: |
          go test ./...
          go vet ./...

      - name: Scan Gin dependencies and reachable code
        working-directory: services/media-gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build Gin media gateway image
        run: docker build --tag netphim/media-gateway:ci services/media-gateway

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test Rust HLS analyzer
        working-directory: services/media-worker-rs
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Build Rust HLS analyzer image
        run: docker build --tag netphim/media-worker-rs:ci services/media-worker-rs

      - name: Build OpenResty edge image
        run: |
          docker build --tag netphim/openresty:ci --file infra/openresty/Dockerfile .
          docker run --rm --add-host web:127.0.0.1 --add-host api:127.0.0.1 --add-host media-gateway:127.0.0.1 netphim/openresty:ci /usr/local/openresty/bin/openresty -t

      - name: Validate Docker Compose deployment
        run: docker compose --project-directory . -f infra/docker/docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RABBITMQ_PASSWORD: ci-rabbitmq-password
          MEILI_MASTER_KEY: ci-meilisearch-private-key-at-least-32-characters
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret
          TOTP_ENCRYPTION_KEY: ci-totp-encryption-key
          HLS_PROXY_SECRET: ci-hls-proxy-secret
          RECOMMENDATION_ADMIN_TOKEN: ci-recommendation-admin-token
          ADMIN_METRICS_TOKEN: ci-admin-metrics-token
          REVALIDATE_SECRET: ci-revalidate-secret
          MEDIA_INTERNAL_TOKEN: ci-media-internal-token
          API_PUBLIC_URL: https://api.example.test
          TUNNEL_TOKEN: ci-tunnel-token

      - name: Validate Terraform infrastructure
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra/terraform:/infra" -w /infra hashicorp/terraform:1.15.5 fmt -check -recursive
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra/terraform:/infra" -w /infra hashicorp/terraform:1.15.5 init -backend=false -input=false
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra/terraform:/infra" -w /infra hashicorp/terraform:1.15.5 validate

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Go-Rust HLS contracts
        run: node scripts/validate-hls-contracts.mjs

      - name: Dependency Vulnerability Audit
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Run type checks
        run: |
          pnpm --filter api exec tsc --noEmit
          pnpm --filter web exec tsc --noEmit
          pnpm --filter @netphim/admin-cms exec tsc --noEmit

      - name: Run lint
        run: |
          pnpm --filter api run lint
          pnpm --filter web run lint
          pnpm --filter @netphim/admin-cms run lint

      - name: Run unit tests
        run: |
          pnpm --filter web run test:unit
          pnpm --filter api test -- --runInBand
          python3 -m unittest discover -s services/recommendation-engine -p "test_*.py"

      - name: Run Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: dummy_secret_for_ci_only_not_production
          REDIS_URL: redis://localhost:6379

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run critical browser flows
        run: pnpm --filter web run test:e2e:critical
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
