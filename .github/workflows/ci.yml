name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: zricethezav/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Vulnerability Audit
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Run type checks
        run: |
          pnpm --filter api exec tsc --noEmit
          pnpm --filter web exec tsc --noEmit
          pnpm --filter @cineverse/admin-cms exec tsc --noEmit

      - name: Run lint
        run: |
          pnpm --filter api run lint
          pnpm --filter web run lint

      - name: Run unit tests
        run: pnpm --filter web run test:unit

      - name: Run Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: dummy_secret_for_ci_only_not_production
          REDIS_URL: redis://localhost:6379
