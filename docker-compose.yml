version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: movie_demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-movie_demo}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movie_demo_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: movie_demo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - movie_demo_network

  # NestJS API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: movie_demo_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-movie_demo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis
    networks:
      - movie_demo_network

  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: movie_demo_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - movie_demo_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: movie_demo_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - movie_demo_network

volumes:
  postgres_data:
  redis_data:

networks:
  movie_demo_network:
    driver: bridge
