version: '3.8'

services:
  # PostgreSQL Database (Development Only)
  postgres:
    image: postgres:17.11-alpine
    container_name: netphim_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_demo_db
    ports:
      - '127.0.0.1:5433:5432'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    volumes:
      - netphim_postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d movie_demo_db']
      interval: 5s
      timeout: 5s
      retries: 12

  # Redis Cache & RediSearch (Development Only)
  redis:
    image: redis/redis-stack-server:latest
    container_name: movie_demo_redis_dev
    restart: unless-stopped
    ports:
      - '6379:6379'
      - '8001:8001' # RedisInsight Web UI để xem index/keys
    volumes:
      - redis_dev_data:/data

  # Optional local Gin gateway. The web app continues to use its Next fallback
  # unless requests are routed here through Nginx or a local reverse proxy.
  media-gateway:
    build:
      context: ./services/media-gateway
      dockerfile: Dockerfile
    container_name: netphim_media_gateway_dev
    restart: unless-stopped
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_ARTWORK_TTL: ${TMDB_ARTWORK_TTL:-720h}
      TMDB_ARTWORK_MISS_TTL: ${TMDB_ARTWORK_MISS_TTL:-168h}
      TMDB_ARTWORK_TIMEOUT: ${TMDB_ARTWORK_TIMEOUT:-2500ms}
      TMDB_ARTWORK_CONCURRENCY: ${TMDB_ARTWORK_CONCURRENCY:-8}
      GIN_MODE: debug
      PORT: 8081
      REDIS_URL: redis://redis:6379
      HLS_PROXY_SECRET: ${HLS_PROXY_SECRET:-netphim-development-only-hls-secret-change-me}
      HLS_PROXY_ALLOWED_HOSTS: ${HLS_PROXY_ALLOWED_HOSTS:-}
      HLS_ANALYZER_ENABLED: ${HLS_ANALYZER_ENABLED:-true}
      HLS_ANALYZER_JOB_STREAM: ${HLS_ANALYZER_JOB_STREAM:-netphim:hls:analysis:jobs}
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-netphim-development-media-token-change-me}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-netphim-local-meili-master-key-32chars}
    ports:
      - '8081:8081'
    depends_on:
      - redis
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: netphim_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-netphim-local-meili-master-key-32chars}
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - meilisearch_dev_data:/meili_data

  media-worker-rs:
    profiles: ['media-analysis']
    build:
      context: ./services/media-worker-rs
      dockerfile: Dockerfile
    container_name: netphim_media_worker_rs_dev
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      HLS_ANALYZER_ALLOWED_HOSTS: ${HLS_PROXY_ALLOWED_HOSTS:-}
      HLS_ANALYZER_REQUIRE_HTTPS: ${HLS_ANALYZER_REQUIRE_HTTPS:-true}
      HLS_ANALYZER_CONCURRENCY: ${HLS_ANALYZER_CONCURRENCY:-2}
      HLS_ANALYZER_RETRY_ATTEMPTS: ${HLS_ANALYZER_RETRY_ATTEMPTS:-3}
      HLS_ANALYZER_RETRY_BACKOFF_MS: ${HLS_ANALYZER_RETRY_BACKOFF_MS:-2000}
      HLS_ANALYZER_RECLAIM_IDLE_MS: ${HLS_ANALYZER_RECLAIM_IDLE_MS:-60000}
      HLS_ANALYZER_HEALTH_PORT: 8091
    ports:
      - '8091:8091'
    depends_on:
      - redis

  # RabbitMQ Message Broker & Management Web UI (Development)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: netphim_rabbitmq_dev
    restart: unless-stopped
    ports:
      - '5672:5672'   # AMQP protocol
      - '15672:15672' # RabbitMQ Management Web Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq

volumes:
  netphim_postgres_dev_data:
  redis_dev_data:
  meilisearch_dev_data:
  rabbitmq_dev_data:
