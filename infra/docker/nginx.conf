user nobody;
worker_processes auto;
error_log stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    lua_package_path "/usr/local/openresty/nginx/conf/lua/?.lua;;";

    # Docker internal DNS — re-resolve upstream hostnames every 5s.
    # This prevents 502s when container IPs change after a deploy/restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    # ── Performance ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer size limits
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 20M;
    large_client_header_buffers 4 8k;

    # Proxy Buffer sizes (fix upstream sent too big header from Next.js)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ── Gzip Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ── High-Performance RAM Micro-Caching ───────────────────────
    proxy_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=microcache:20m max_size=500m inactive=60s;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 302 3s;
    proxy_cache_valid 404 1s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    # ── Persistent Multi-Build Static Chunk Cache (30 days retention) ─
    # Keeps Next.js static JS/CSS chunks across releases so existing users never hit 404 ChunkLoadError
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:50m max_size=2g inactive=30d use_temp_path=off;

    # ── Rate Limiting ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Stable 10% rollout based on client identity. Raise to 30/70/100 only
    # after provider health and buffering metrics remain healthy.
    split_clients "${remote_addr}${http_user_agent}" $media_gateway_canary {
        10%     1;
        *       0;
    }

    # ── Upstream Load Balancing Clusters ─────────────────────────
    # web and api use variable proxy_pass for dynamic DNS resolution.

    upstream media_gateway_backend {
        least_conn;
        server media-gateway:8081 max_fails=2 fail_timeout=10s;
        keepalive 128;
    }

    # ── Main Server (HTTP) ───────────────────────────────────────
    # Cloudflare Tunnel kết nối vào đây (port 80)
    # Cloudflare xử lý HTTPS → bạn không cần SSL cert trên VPS
    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/openresty/ssl/fullchain.pem;
        ssl_certificate_key /etc/openresty/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn conn_limit_per_ip 25;

        access_by_lua_block {
            require("security").check()
        }

        # ── Cloudflare Real IP ──────────────────────────────────
        # FIX #5: Chỉ trust IP ranges chính thức của Cloudflare
        # Source: https://www.cloudflare.com/ips/
        # IPv4 ranges
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        # IPv6 ranges
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;

        # ── Security Headers ──────────────────────────────────────
        # Security headers (X-Frame-Options, X-Content-Type-Options, Referrer-Policy,
        # Permissions-Policy, HSTS, CSP) are emitted authoritatively by Next.js for web pages
        # and Helmet for NestJS API responses to prevent duplicate headers in DevTools.

        # CSP is emitted by Next.js for pages and Helmet for API responses.
        # Adding a second global policy here would intersect with the upstream
        # policy and can block Next.js bootstrap scripts unexpectedly.

        # ── Health Check ──────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── Firebase Auth Reverse Proxy (Custom Domain) ────────────
        location ^~ /__/auth/ {
            resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=300s;
            resolver_timeout 5s;
            proxy_pass https://flexphim-1.firebaseapp.com;
            proxy_set_header Host flexphim-1.firebaseapp.com;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }

        # ── NestJS API Routes ────────────────────────────────────
        # Only the versioned backend prefix belongs to Nest. Other /api/*
        # endpoints are Next.js route handlers (image, TMDB and HLS proxies).
        location ^~ /api/v1/ {
            limit_req zone=api_limit burst=40 nodelay;

            set $api_upstream "http://api:4000";
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache microcache;
            proxy_cache_methods GET HEAD;
            add_header X-Microcache $upstream_cache_status always;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── WebSocket (Watch Party) ───────────────────────────────
        location /socket.io/ {
            set $api_upstream "http://api:4000";
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Static Files (Next.js _next/static) ──────────────────
        location /_next/static/ {
            set $web_upstream "http://web:3000";
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Persistent 30-day on-disk chunk cache: keeps old chunks alive so users never hit 404 ChunkLoadError
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_404 http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            access_log off;
        }

        # ── Service Worker (Exact match: must never be cached on disk or edge) ─
        location = /sw.js {
            set $web_upstream "http://web:3000";
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            access_log off;
        }

        # ── Static Assets ─────────────────────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
            set $web_upstream "http://web:3000";
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ── Gin HLS Gateway with transparent Next.js fallback ────
        location /api/hls-proxy {
            limit_req zone=api_limit burst=10 nodelay;

            error_page 418 = @hls_next_proxy;
            if ($media_gateway_canary = 0) { return 418; }

            proxy_pass http://media_gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 300s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @hls_next_proxy;
            add_header X-NetPhim-Media-Path "gin" always;
        }

        location = /openresty-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"openresty","waf":"enabled"}';
        }

        location @hls_next_proxy {
            set $web_upstream "http://web:3000";
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            add_header X-NetPhim-Media-Path "next-fallback" always;
        }

        # ── Local Image Proxy (Cached on VPS disk to prevent repeated upstream/worker fetches) ─
        location = /api/image-proxy {
            limit_req zone=general_limit burst=100 nodelay;

            set $web_upstream "http://web:3000";
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;

            proxy_cache static_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 304 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # ── Remaining Next.js Route Handlers ─────────────────────
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            set $web_upstream "http://web:3000";
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
        }

        # ── Next.js Web App ───────────────────────────────────────
        location / {
            limit_req zone=general_limit burst=80 nodelay;

            set $web_upstream "http://web:3000";
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;

            # Zero-Downtime resilience: retry if web is momentarily restarting
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # HTML documents must always revalidate so users receive new versions without clearing cache
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            add_header Cloudflare-CDN-Cache-Control "no-store" always;
            add_header CDN-Cache-Control "no-store" always;
        }
    }
}
