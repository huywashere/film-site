apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netphim-api-hpa
  namespace: netphim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netphim-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netphim-web-hpa
  namespace: netphim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netphim-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
