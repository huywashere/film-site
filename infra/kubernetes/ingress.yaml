apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netphim-ingress
  namespace: netphim
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - netphim.com
        - api.netphim.com
      secretName: netphim-tls-cert
  rules:
    - host: netphim.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netphim-web-service
                port:
                  number: 3000
    - host: api.netphim.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netphim-api-service
                port:
                  number: 3001
