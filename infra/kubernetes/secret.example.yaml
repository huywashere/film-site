metadata:
  name: netphim-web-secret
  namespace: netphim
type: Opaque
stringData:
  REDIS_URL: "replace-at-deploy-time"
  HLS_PROXY_SECRET: "replace-at-deploy-time"
  TMDB_API_KEY: "replace-at-deploy-time"
  TMDB_ACCESS_TOKEN: "replace-at-deploy-time"
---
apiVersion: v1
kind: Secret
metadata:
  name: netphim-redis-secret
  namespace: netphim
type: Opaque
stringData:
  REDIS_PASSWORD: "replace-at-deploy-time"
