apiVersion: v1
kind: Secret
metadata:
  name: netphim-api-secret
  namespace: netphim
type: Opaque
stringData:
  DATABASE_URL: "replace-at-deploy-time"
  DIRECT_DATABASE_URL: "replace-with-a-direct-postgresql-url-for-migrations-and-backups"
  REDIS_URL: "replace-at-deploy-time"
  JWT_SECRET: "replace-at-deploy-time"
  JWT_REFRESH_SECRET: "replace-at-deploy-time"
  TOTP_ENCRYPTION_KEY: "replace-at-deploy-time"
  ADMIN_METRICS_TOKEN: "replace-at-deploy-time"
  TMDB_ACCESS_TOKEN: "replace-at-deploy-time"
  TURNSTILE_SECRET_KEY: "replace-at-deploy-time"
