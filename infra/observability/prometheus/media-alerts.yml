groups:
  - name: netphim-media
    rules:
      - alert: NetPhimMediaGatewayHighErrorRate
        expr: rate(netphim_media_errors_total[5m]) / clamp_min(rate(netphim_media_requests_total[5m]), 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: FlexPhim media gateway error rate is above 5%

      - alert: NetPhimMediaGatewaySlowP95
        expr: histogram_quantile(0.95, sum by (le) (rate(netphim_media_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: FlexPhim media gateway p95 latency is above 1.5 seconds

      - alert: NetPhimHlsAnalyzerPendingJobs
        expr: netphim_hls_analyzer_pending_jobs > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Rust HLS analyzer has jobs pending for more than five minutes

      - alert: NetPhimHlsAnalyzerDeadLetter
        expr: increase(netphim_hls_analyzer_jobs_dead_lettered_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Rust HLS analyzer moved a malformed job to its dead-letter stream

      - alert: NetPhimHlsAnalyzerRedisErrors
        expr: increase(netphim_hls_analyzer_redis_errors_total[5m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Rust HLS analyzer is repeatedly losing Redis connectivity
