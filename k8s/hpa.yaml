apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cineverse-api-hpa
  namespace: cineverse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cineverse-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cineverse-web-hpa
  namespace: cineverse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cineverse-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
