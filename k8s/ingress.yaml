apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cineverse-ingress
  namespace: cineverse
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - cineverse.com
        - api.cineverse.com
      secretName: cineverse-tls-cert
  rules:
    - host: cineverse.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cineverse-web-service
                port:
                  number: 3000
    - host: api.cineverse.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cineverse-api-service
                port:
                  number: 3001
