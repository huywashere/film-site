apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress-only-from-cineverse
  namespace: cineverse
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["cineverse-api", "cineverse-web"]
      ports:
        - protocol: TCP
          port: 6379
