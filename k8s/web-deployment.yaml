apiVersion: apps/v1
kind: Deployment
metadata:
  name: cineverse-web
  namespace: cineverse
  labels:
    app: cineverse-web
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cineverse-web
  template:
    metadata:
      labels:
        app: cineverse-web
        tier: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: registry.gitlab.com/nguyenphuhuy/film-site/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: cineverse-config
            - secretRef:
                name: cineverse-secret
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: cineverse-web-service
  namespace: cineverse
  labels:
    app: cineverse-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: cineverse-web
