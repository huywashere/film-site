user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer size limits
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 20M;
    large_client_header_buffers 4 8k;

    # ── Gzip Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ── High-Performance RAM Micro-Caching ───────────────────────
    proxy_cache_path /tmp/nginx_microcache levels=1:2 keys_zone=microcache:20m max_size=500m inactive=60s;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 302 3s;
    proxy_cache_valid 404 1s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;

    # ── Rate Limiting ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # ── Upstream Load Balancing Clusters ─────────────────────────
    upstream api_backend {
        least_conn; # Phân tải sang node rảnh nhất
        server api:4000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream web_backend {
        least_conn; # Phân tải sang node rảnh nhất
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ── Main Server (HTTP) ───────────────────────────────────────
    # Cloudflare Tunnel kết nối vào đây (port 80)
    # Cloudflare xử lý HTTPS → bạn không cần SSL cert trên VPS
    server {
        listen 80;
        server_name _;

        limit_conn conn_limit_per_ip 25;

        # ── Cloudflare Real IP ──────────────────────────────────
        # FIX #5: Chỉ trust IP ranges chính thức của Cloudflare
        # Source: https://www.cloudflare.com/ips/
        # IPv4 ranges
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        # IPv6 ranges
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;

        # ── Security Headers ──────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # FIX #9: HSTS — báo browser chỉ kết nối HTTPS (Cloudflare xử lý TLS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # FIX #10: Content-Security-Policy trên Nginx (lớp bảo vệ thứ 2)
        # Đây là CSP cho API responses — Next.js có CSP riêng chi tiết hơn
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none';" always;

        # ── Health Check ──────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ── NestJS API Routes ────────────────────────────────────
        # Only the versioned backend prefix belongs to Nest. Other /api/*
        # endpoints are Next.js route handlers (image, TMDB and HLS proxies).
        location ^~ /api/v1/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache microcache;
            proxy_cache_methods GET HEAD;
            add_header X-Microcache $upstream_cache_status always;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── WebSocket (Watch Party) ───────────────────────────────
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Static Files (Next.js _next/static) ──────────────────
        location /_next/static/ {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Static Assets ─────────────────────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ── Next.js HLS Proxy (video streaming) ──────────────────
        location /api/hls-proxy {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;        # Quan trọng cho streaming
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # ── Remaining Next.js Route Handlers ─────────────────────
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
        }

        # ── Next.js Web App ───────────────────────────────────────
        location / {
            limit_req zone=general_limit burst=80 nodelay;

            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
        }
    }
}
