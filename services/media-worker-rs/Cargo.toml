[package]
name = "netphim-media-worker"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.7"
futures-util = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
